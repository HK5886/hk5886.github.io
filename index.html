<!DOCTYPE html>
<html>
<head>

    <style>
        body {
            background: #0f172a;
            color: white;

        button {
            background: #3b82f6;
            border: none;

            padding: 10px 20px;

<body>
    <h1>HK5886 的互动站</h1>

    <div id="log"></div>
    <p>如果看不到上面的蓝色按钮，说明可能是网络或GitHub Pages缓存问题，请强制刷新（Ctrl+F5）或重新上传文件。</p>
